<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<ul>
    {% for book in object_list %}
    <li>
        <a href="{% url 'details' book.id %}">{{ book.title }}</a>
    </li>
    {% empty %}
    <p>No books here!</p>
    {% endfor %}

</ul>
</body>
</html>
